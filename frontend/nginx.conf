server {
  listen 80;
  server_name _;
  root /usr/share/nginx/site/current;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 草稿预览产物与正式发布共用同一个静态卷，位于 preview/ 子目录，
  # 通过 /__preview/ 访问，生命周期独立于 current。
  location /__preview/ {
    alias /usr/share/nginx/site/preview/;
    try_files $uri $uri/ /__preview/index.html;
    add_header Cache-Control "no-store" always;
  }

  # Product slugs are stored in the commerce database. Serve the shared Astro
  # detail shell for new slugs; published slugs use their pre-rendered SEO page.
  location ~* ^/shop/product/[a-z0-9-]+/?$ {
    try_files $uri $uri/ /shop/product/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location ~* ^/zh/shop/product/[a-z0-9-]+/?$ {
    try_files $uri $uri/ /zh/shop/product/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location ~* ^/ar/shop/product/[a-z0-9-]+/?$ {
    try_files $uri $uri/ /ar/shop/product/index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location /zh/ {
    error_page 404 /zh/404/index.html;
    try_files $uri $uri/ =404;
  }

  location /ar/ {
    error_page 404 /ar/404/index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
